[package]
name = "matchradar"
version = "1.1.0"
edition = "2021"
description = "A compact Premier League and Champions League widget for Windows."
repository = "https://github.com/awishtodiexz/MatchRadar"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip", "http2", "system-proxy"] }
tokio = { version = "1", features = ["time", "sync", "macros"] }
