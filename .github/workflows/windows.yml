name: Windows validation
on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      - run: npm run check:version
      - run: npm run format:check
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run verify:ui
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --all-targets --manifest-path src-tauri/Cargo.toml -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      # Playwright traces and failure screenshots are the only diagnosis for a
      # failed UI journey; keep them from the failing run instead of discarding
      # the evidence with the runner.
      - uses: actions/upload-artifact@v6
        if: failure()
        with:
          name: matchradar-ui-artifacts
          path: |
            verification/artifacts/browser
            test-results
          if-no-files-found: ignore
          retention-days: 7
      - run: npm run tauri build
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      - uses: actions/upload-artifact@v6
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        with:
          name: matchradar-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
